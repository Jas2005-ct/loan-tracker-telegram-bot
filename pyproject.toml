[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-tracker-telegram-bot"
version = "0.1.0"
description = "Telegram-based family gold loan tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "python-telegram-bot>=21,<23",
    "sqlalchemy>=2.0,<3",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
